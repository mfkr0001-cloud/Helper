name: Build GD Bot AI

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  build-android64:
    name: Build Android64 (.geode)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build mod with Geode SDK 5.11.2
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64
          sdk: given
          cli: latest
          build-config: Release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GD-Bot-AI-Android64
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
          retention-days: 14
